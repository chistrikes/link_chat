<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .chat {
            width: 100%;
            max-width: 650px;
            height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h2 {
            margin: 0;
        }

        .status {
            font-size: 13px;
            color: #20a050;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            width: fit-content;
            max-width: 80%;
            background: #e8f0ff;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        form {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #5d99fa;
        }

        button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #5d99fa;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .chat {
                height: 100dvh;
            }

            .message {
                max-width: 88%;
            }
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        <h2>💬 Online Chat</h2>
        <span class="status" id="status">Connecting...</span>
    </div>

    <div id="messages"></div>

    <form id="form">
        <input
            id="input"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button type="submit">Send</button>
    </form>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

    const socket = io();

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");

    socket.on("connect", () => {
        status.textContent = "● Online";
    });

    socket.on("disconnect", () => {
        status.textContent = "● Offline";
    });

    form.addEventListener("submit", (e) => {
        e.preventDefault();

        const message = input.value.trim();

        if (!message) return;

        socket.emit("chat message", message);

        input.value = "";
        input.focus();
    });

    socket.on("chat message", (message) => {

        const div = document.createElement("div");

        div.className = "message";

        div.textContent = message;

        messages.appendChild(div);

        messages.scrollTop = messages.scrollHeight;
    });

</script>

</body>
</html>
