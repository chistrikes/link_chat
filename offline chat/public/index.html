<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Link Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        button,
        input {
            font: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* JOIN SCREEN */

        #joinScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .join-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        .join-card label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .join-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            margin-bottom: 18px;
        }

        .join-card input:focus {
            border-color: #5d99fa;
        }

        .join-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #5d99fa;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* CHAT */

        .chat {
            width: 100%;
            max-width: 850px;
            height: 100vh;
            height: 100dvh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 16px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .header-left {
            min-width: 0;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .room-name {
            font-size: 13px;
            color: #777;
            margin-top: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status {
            font-size: 13px;
            color: #20a050;
            white-space: nowrap;
        }

        .users-button {
            border: none;
            background: #eef4ff;
            color: #315f9e;
            padding: 8px 11px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            width: fit-content;
            max-width: 80%;
            background: #e8f0ff;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        .message.mine {
            margin-left: auto;
            background: #5d99fa;
            color: white;
        }

        .message-name {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .message-text {
            font-size: 15px;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.65;
            margin-top: 5px;
        }

        .system-message {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin: 12px 0;
        }

        #typing {
            height: 20px;
            padding-left: 20px;
            color: #888;
            font-size: 12px;
        }

        form {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #ddd;
        }

        #input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        #input:focus {
            border-color: #5d99fa;
        }

        form button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #5d99fa;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* USERS PANEL */

        #usersPanel {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 250px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,.12);
            padding: 16px;
            z-index: 10;
        }

        #usersPanel h3 {
            margin-top: 0;
            font-size: 15px;
        }

        #userList {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        #userList li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .join-card {
                padding: 25px;
            }

            .header {
                padding: 14px;
            }

            .header h2 {
                font-size: 17px;
            }

            .status {
                display: none;
            }

            #messages {
                padding: 15px;
            }

            .message {
                max-width: 88%;
            }

            #usersPanel {
                right: 10px;
                left: 10px;
                width: auto;
            }
        }
    </style>
</head>

<body>

<!-- JOIN SCREEN -->

<div id="joinScreen">

    <div class="join-card">

        <div class="logo">💬 Link Chat</div>

        <div class="subtitle">
            Join a room and start chatting.
        </div>

        <form id="joinForm">

            <label for="username">Username</label>

            <input
                id="username"
                maxlength="20"
                placeholder="Enter your username"
                autocomplete="off"
                required
            >

            <label for="room">Room</label>

            <input
                id="room"
                maxlength="30"
                placeholder="e.g. friends"
                value="general"
                autocomplete="off"
                required
            >

            <button class="join-button" type="submit">
                Join Chat
            </button>

        </form>

    </div>

</div>


<!-- CHAT SCREEN -->

<div class="chat hidden" id="chatScreen">

    <div class="header">

        <div class="header-left">

            <h2>💬 Link Chat</h2>

            <div class="room-name" id="roomName">
                Room: general
            </div>

        </div>

        <div class="header-right">

            <span class="status" id="status">
                Connecting...
            </span>

            <button class="users-button" id="usersButton">
                👥 <span id="userCount">0</span>
            </button>

        </div>

    </div>


    <div id="usersPanel" class="hidden">

        <h3>Online Users</h3>

        <ul id="userList"></ul>

    </div>


    <div id="messages"></div>

    <div id="typing"></div>

    <form id="form">

        <input
            id="input"
            placeholder="Type a message..."
            autocomplete="off"
            maxlength="500"
        >

        <button type="submit">
            Send
        </button>

    </form>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

    const socket = io();

    const joinScreen = document.getElementById("joinScreen");
    const chatScreen = document.getElementById("chatScreen");

    const joinForm = document.getElementById("joinForm");
    const usernameInput = document.getElementById("username");
    const roomInput = document.getElementById("room");

    const form = document.getElementById("form");
    const input = document.getElementById("input");

    const messages = document.getElementById("messages");
    const status = document.getElementById("status");

    const roomName = document.getElementById("roomName");

    const typing = document.getElementById("typing");

    const usersButton = document.getElementById("usersButton");
    const usersPanel = document.getElementById("usersPanel");
    const userCount = document.getElementById("userCount");
    const userList = document.getElementById("userList");

    let myUsername = "";
    let typingTimeout;


    /* CONNECTION */

    socket.on("connect", () => {

        status.textContent = "● Online";

    });


    socket.on("disconnect", () => {

        status.textContent = "● Offline";

    });


    /* JOIN ROOM */

    joinForm.addEventListener("submit", (e) => {

        e.preventDefault();

        const username = usernameInput.value.trim();
        const room = roomInput.value.trim();

        if (!username || !room) return;

        myUsername = username;

        socket.emit("join room", {
            username,
            room
        });

    });


    socket.on("joined room", ({ username, room }) => {

        joinScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");

        roomName.textContent = `Room: ${room}`;

        input.focus();

    });


    /* SEND MESSAGE */

    form.addEventListener("submit", (e) => {

        e.preventDefault();

        const message = input.value.trim();

        if (!message) return;

        socket.emit("chat message", message);

        input.value = "";

        socket.emit("stop typing");

        input.focus();

    });


    /* RECEIVE MESSAGE */

    socket.on("chat message", (data) => {

        const div = document.createElement("div");

        div.className = "message";

        if (data.username === myUsername) {
            div.classList.add("mine");
        }

        const name = document.createElement("div");

        name.className = "message-name";

        name.textContent = data.username;

        const text = document.createElement("div");

        text.className = "message-text";

        text.textContent = data.message;

        const time = document.createElement("div");

        time.className = "message-time";

        time.textContent = formatTime(data.time);

        div.appendChild(name);
        div.appendChild(text);
        div.appendChild(time);

        messages.appendChild(div);

        messages.scrollTop = messages.scrollHeight;

    });


    /* SYSTEM MESSAGE */

    socket.on("system message", (data) => {

        const div = document.createElement("div");

        div.className = "system-message";

        div.textContent = `${data.text} • ${formatTime(data.time)}`;

        messages.appendChild(div);

        messages.scrollTop = messages.scrollHeight;

    });


    /* ONLINE USERS */

    socket.on("room users", (data) => {

        userCount.textContent = data.count;

        userList.innerHTML = "";

        data.users.forEach((username) => {

            const li = document.createElement("li");

            li.textContent = `🟢 ${username}`;

            userList.appendChild(li);

        });

    });


    /* TYPING */

    socket.on("typing", (data) => {

        typing.textContent = `${data.username} is typing...`;

    });


    socket.on("stop typing", () => {

        typing.textContent = "";

    });


    input.addEventListener("input", () => {

        socket.emit("typing");

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {

            socket.emit("stop typing");

        }, 1000);

    });


    /* USERS PANEL */

    usersButton.addEventListener("click", () => {

        usersPanel.classList.toggle("hidden");

    });


    /* TIME */

    function formatTime(timestamp) {

        return new Date(timestamp).toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    }

</script>

</body>
</html>
